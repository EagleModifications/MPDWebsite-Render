<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Metro Police Department</title>

    <meta
      name="description"
      content="Metro Police Department"
    />

    <meta
      name="theme-color"
      content="#3b82f6"
    />

    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <!-- Discord / Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://mpd-calirp.com/"
    />

    <meta
      property="og:site_name"
      content="Metro Police Department"
    />

    <meta
      property="og:title"
      content="Metro Police Department"
    />

    <meta
      property="og:description"
      content="Metro Police Department"
    />

    <!-- Automatically generates a screenshot of the live website -->
    <meta
      property="og:image"
      content="https://api.microlink.io/?url=https%3A%2F%2Fmpd-calirp.com%2F&amp;screenshot=true&amp;meta=false&amp;embed=screenshot.url&amp;viewport.width=1200&amp;viewport.height=630"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Metro Police Department"
    />

    <meta
      name="twitter:description"
      content="Metro Police Department"
    />

    <meta
      name="twitter:image"
      content="https://api.microlink.io/?url=https%3A%2F%2Fmpd-calirp.com%2F&amp;screenshot=true&amp;meta=false&amp;embed=screenshot.url&amp;viewport.width=1200&amp;viewport.height=630"
    />

    <meta
      name="twitter:image:alt"
      content="Metro Police Department website preview"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
