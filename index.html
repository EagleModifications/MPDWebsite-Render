<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Metro Police Department</title>

    <meta
      name="description"
      content="Metro Police Department"
    />

    <meta
      name="theme-color"
      content="#3b82f6"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://metropd-calirp.com/"
    />

    <link
      rel="icon"
      href="/logo.png"
      type="image/png"
    />

    <!-- Open Graph -->
    <!--
      The server rewrites these tags for the exact URL being requested.
      The og:image is generated dynamically by /api/og — no stored preview
      PNG is required.
    -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://metropd-calirp.com/"
    />

    <meta
      property="og:title"
      content="Metro Police Department"
    />

    <meta
      property="og:description"
      content="Metro Police Department"
    />

    <meta
      property="og:image"
      content="https://metropd-calirp.com/api/og?url=https%3A%2F%2Fmetropd-calirp.com%2F"
    />

    <meta
      property="og:image:secure_url"
      content="https://metropd-calirp.com/api/og?url=https%3A%2F%2Fmetropd-calirp.com%2F"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <!-- Twitter / Discord-compatible large preview metadata -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Metro Police Department"
    />

    <meta
      name="twitter:description"
      content="Metro Police Department"
    />

    <meta
      name="twitter:image"
      content="https://metropd-calirp.com/api/og?url=https%3A%2F%2Fmetropd-calirp.com%2F"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
