name: MPD Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v1.0.1)"
        required: true
        default: "v1.0.1"
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund

      - name: Set release version
        shell: pwsh
        run: |
          if ("${env:GITHUB_REF}" -like "refs/tags/v*") {
            $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          } else {
            $version = "${{ inputs.release_tag }}".TrimStart("v")
          }
          npm version $version --no-git-tag-version --allow-same-version

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: mpd-windows
          path: release/*
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund

      - name: Set release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.release_tag }}"
            VERSION="${VERSION#v}"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build macOS installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg --publish never

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: mpd-macos
          path: release/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund

      - name: Set release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.release_tag }}"
            VERSION="${VERSION#v}"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build Linux AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --publish never

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: mpd-linux
          path: release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release Assets
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: mpd-windows
          path: release/windows

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: mpd-macos
          path: release/macos

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: mpd-linux
          path: release/linux

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          find release -type f \
            \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \) \
            -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            release/windows/*.exe
            release/windows/*.blockmap
            release/windows/latest.yml
            release/macos/*.dmg
            release/macos/*.blockmap
            release/macos/latest-mac.yml
            release/linux/*.AppImage
            release/linux/*.blockmap
            release/linux/latest-linux.yml
            release/SHA256SUMS.txt
          generate_release_notes: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
