name: Build MPD Desktop

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run desktop:build

      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"

          $files = Get-ChildItem -Path "dist" -File |
            Where-Object {
              $_.Name -match '\.(exe|yml|blockmap)$'
            }

          if ($files.Count -eq 0) {
            Write-Error "No Electron release files were found in dist/"
            Get-ChildItem -Path "dist" -Recurse
            exit 1
          }

          foreach ($file in $files) {
            gh release upload $tag $file.FullName --clobber --repo "${{ github.repository }}"
          }
