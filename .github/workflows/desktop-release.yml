name: Build MPD Desktop

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run desktop:build

      - name: Show build output
        shell: pwsh
        run: |
          Write-Host "Files generated in release/:"
          Get-ChildItem -Path "release" -Recurse | Select-Object FullName, Length

      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"

          $files = Get-ChildItem -Path "release" -File |
            Where-Object {
              $_.Extension -in @(".exe", ".yml", ".blockmap")
            }

          if ($files.Count -eq 0) {
            Write-Error "No Electron release files were found in release/"
            Get-ChildItem -Path "release" -Recurse
            exit 1
          }

          foreach ($file in $files) {
            Write-Host "Uploading $($file.Name)..."
            gh release upload $tag $file.FullName --clobber --repo "${{ github.repository }}"
          }
